services:
  backend:
    build:
      context: ./backend
    environment:
      # 本地 compose 默认 local：自动幂等补样例；部署时可用 .env 覆盖 APP_ENV=prod
      APP_ENV: ${APP_ENV:-local}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_DATABASE_URL: ${APP_DATABASE_URL:-sqlite:///data/app.db}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      APP_OVERVIEW_TODAY: ${APP_OVERVIEW_TODAY:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/srv/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health'); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
