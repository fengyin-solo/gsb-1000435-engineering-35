services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - SEED_ON_START=1
      - MIGRATE_ON_START=1
      # 生产把这里改成持久卷挂载路径，并将 SEED_ON_START 置 0
      - DATABASE_URL=/data/app.db
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # 生产由 nginx 同源反代 /api，前端请求保持相对路径即可
        - VITE_API_BASE=
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
